<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .blue-box {
    width: 500px;
    height: 300px;
    background-color: blue;
    margin-top: 180px;
    color: white;
    }
 </style>
</head>
<body>
   
<div class="historydiv" style="width: 500px;height: 500px;background-color: black;"><button class="js-button">Click me</button>
 
</div>
<script>
    const button=document.querySelector('.js-button');
    const historydiv=document.querySelector('.historydiv');
    let shown=false;
    let blueDiv=null;
    button.addEventListener('click',()=>{
      if(!shown){
        blueDiv=document.createElement('div');
        blueDiv.classList.add('blue-box');
        blueDiv.innerText = 'Appending history';

        historydiv.appendChild(blueDiv);
        shown=true;
      }else{
        if(blueDiv){
          historydiv.removeChild(blueDiv);
        }
        shown=false;
      }

    })


</script>

</body>
</html>
